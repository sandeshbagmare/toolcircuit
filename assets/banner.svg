<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="toolcircuit: stop retrying a tool that is down">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="hsl(12 68% 12%)">
        <animate attributeName="stop-color" values="hsl(12 68% 12%);hsl(12 62% 20%);hsl(12 68% 12%)" dur="14s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="hsl(12 62% 20%)">
        <animate attributeName="stop-color" values="hsl(12 62% 20%);hsl(12 68% 12%);hsl(12 62% 20%)" dur="14s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.28" r="0.62">
      <stop offset="0" stop-color="hsl(42 88% 66%)" stop-opacity="0.34"/>
      <stop offset="1" stop-color="hsl(42 88% 66%)" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="hsl(12 40% 40%)" opacity="0.35"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="0" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#dots)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>
  <g transform="translate(880, -10)">
    <polygon points="160,26 276,74 276,178 160,296 44,178 44,74" fill="none" stroke="hsl(42 88% 66%)" stroke-width="3" stroke-linejoin="round" opacity="0.85" stroke-dasharray="14 10"><animate attributeName="stroke-dashoffset" values="0;-48" dur="3.4s" repeatCount="indefinite"/></polygon><polygon points="160,26 276,74 276,178 160,296 44,178 44,74" fill="hsl(42 88% 66%)" opacity="0.10"/><path d="M120 160 l28 30 l56 -70" fill="none" stroke="hsl(42 92% 78%)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="130"><animate attributeName="stroke-dashoffset" values="130;0;0;130" dur="4.2s" repeatCount="indefinite"/></path>
  </g>
  <text x="64" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="5" fill="hsl(42 92% 78%)" opacity="0.85">RELIABILITY</text>
  <text x="62" y="146" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="60" font-weight="800" fill="#f8fafc">toolcircuit</text>
  <text x="64" y="192" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="19" fill="#cbd5e1">stop retrying a tool that is down</text>
  <g transform="translate(64, 218)">
    <rect width="300" height="40" rx="10" fill="#0b1220" opacity="0.72" stroke="hsl(42 92% 78%)" stroke-opacity="0.45"/>
    <text x="18" y="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="hsl(42 92% 78%)">$ pip install toolcircuit</text>
    <rect width="2" height="18" x="286" y="11" fill="hsl(42 92% 78%)">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
