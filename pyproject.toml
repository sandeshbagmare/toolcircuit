[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "toolcircuit"
version = "0.1.0"
description = "Per-tool circuit breaker for agent tool calls, so a dead API stops being retried"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Sandesh Bagmare" }]
keywords = ["agents", "llm", "circuit-breaker", "reliability", "tool-calls"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/sandeshbagmare/toolcircuit"
Issues = "https://github.com/sandeshbagmare/toolcircuit/issues"
Changelog = "https://github.com/sandeshbagmare/toolcircuit/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/toolcircuit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
